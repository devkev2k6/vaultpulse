<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>VaultPulse AI Companion</title>
  <style>
    :root {
      --bg: #0B0C0E;
      --surface: #101216;
      --line: #1F242D;
      --ink: #F0F2F5;
      --ink-muted: #9CA3AF;
      --accent: #ADFF2F;
      --alert: #FF6B00;
      --positive: #ADFF2F;
    }
    body {
      width: 360px;
      margin: 0;
      padding: 16px;
      background-color: var(--bg);
      color: var(--ink);
      font-family: 'JetBrains Mono', system-ui, monospace;
      font-size: 12px;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      padding-bottom: 10px;
      margin-bottom: 14px;
    }
    .brand {
      font-weight: bold;
      font-size: 14px;
      text-transform: uppercase;
    }
    .accent { color: var(--accent); }
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      padding: 12px;
      margin-bottom: 12px;
    }
    .flex-between {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .score {
      font-size: 24px;
      font-weight: 800;
    }
    .btn {
      width: 100%;
      padding: 10px;
      background: var(--accent);
      color: #0B0C0E;
      border: none;
      font-weight: bold;
      font-family: inherit;
      cursor: pointer;
      text-transform: uppercase;
      font-size: 11px;
    }
    .btn:hover { brightness: 1.1; }
    .badge {
      padding: 2px 6px;
      font-size: 9px;
      background: rgba(173, 255, 47, 0.15);
      color: var(--accent);
      border: 1px solid rgba(173, 255, 47, 0.3);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">VaultPulse<span class="accent">.AI</span></div>
    <div class="badge">Companion v2.5</div>
  </div>

  <div class="card">
    <div class="flex-between">
      <span style="color: var(--ink-muted); text-transform: uppercase;">Wealth Health Score</span>
      <span class="score accent">84<span style="font-size: 12px; color: var(--ink-muted);">/100</span></span>
    </div>
    <div style="font-size: 10px; color: var(--ink-muted); margin-top: 4px;">
      Auto-save SIP active: ₹1,850/mo
    </div>
  </div>

  <div class="card">
    <div class="flex-between" style="margin-bottom: 6px;">
      <span style="font-weight: bold;">E-Commerce Shield</span>
      <span class="badge" style="background: rgba(255, 107, 0, 0.15); color: var(--alert); border-color: rgba(255, 107, 0, 0.3);">ACTIVE</span>
    </div>
    <div style="font-size: 11px; color: var(--ink-muted);">
      Scanning shopping cart checkouts for price drops & impulse spending barriers.
    </div>
  </div>

  <button class="btn" id="openDashboard">Open Full Dashboard (Localhost:3000)</button>

  <script src="popup.js"></script>
</body>
</html>
